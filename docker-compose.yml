services:
  web:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://latin:latin@database:5432/latin_tutor?schema=public
      LATIN_NLP_URL: http://latin-nlp:8001
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
      latin-nlp:
        condition: service_started

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: latin_tutor
      POSTGRES_USER: latin
      POSTGRES_PASSWORD: latin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latin -d latin_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  latin-nlp:
    build: ./services/latin-nlp
    environment:
      LATINCY_MODEL: la_core_web_lg
    ports:
      - "8001:8001"

volumes:
  node_modules:
  postgres_data:
